name: JJWW Reader Stage 5 Pagination

on:
  push:
    branches:
      - feature/jjww-reader-stage5
    paths:
      - 'ios/JJWWReader/**'
      - '.github/workflows/jjww-reader-stage5-pagination.yml'
  pull_request:
    paths:
      - 'ios/JJWWReader/**'
      - '.github/workflows/jjww-reader-stage5-pagination.yml'

jobs:
  pagination-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Stage 0 through Stage 5 tests
        working-directory: ios/JJWWReader
        run: swift test

      - name: Re-run canonical plain-text gate
        working-directory: ios/JJWWReader
        run: swift run jjww-stage0-print > /tmp/jjww-stage0-print.txt

      - name: Render Stage 5 static pagination gate
        working-directory: ios/JJWWReader
        run: |
          mkdir -p /tmp/jjww-stage5
          swift run jjww-pagination-snapshot \
            /tmp/jjww-stage5/pagination-transitions-stage5.png \
            ../../jesse-james-and-the-widow-whipple-canonical-v1.1.json
          file /tmp/jjww-stage5/pagination-transitions-stage5.png
          cat /tmp/jjww-stage5/pagination-summary-stage5.json

      - name: Verify production pagination builds
        working-directory: ios/JJWWReader
        run: swift build -c release --target JJWWPagination

      - name: Upload Stage 5 gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjww-stage5-pagination
          path: /tmp/jjww-stage5/**
          if-no-files-found: error
