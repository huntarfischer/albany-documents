name: JJWW Reader Stage 7 Binding

on:
  push:
    branches:
      - feature/jjww-reader-stage7
    paths:
      - 'ios/JJWWReader/**'
      - '.github/workflows/jjww-reader-stage7-binding.yml'
  pull_request:
    paths:
      - 'ios/JJWWReader/**'
      - '.github/workflows/jjww-reader-stage7-binding.yml'

jobs:
  binding-gate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Stage 0 through Stage 7 tests
        working-directory: ios/JJWWReader
        run: swift test

      - name: Re-run canonical plain-text gate
        working-directory: ios/JJWWReader
        run: swift run jjww-stage0-print > /tmp/jjww-stage0-print.txt

      - name: Render Stage 7 binding gate
        working-directory: ios/JJWWReader
        run: |
          mkdir -p /tmp/jjww-stage7
          swift run jjww-stage7-binding-snapshot \
            /tmp/jjww-stage7/book-shell-stage7.png \
            ../../jesse-james-and-the-widow-whipple-canonical-v1.1.json
          file /tmp/jjww-stage7/book-shell-stage7.png
          cat /tmp/jjww-stage7/book-shell-summary-stage7.json

      - name: Verify production binding builds
        working-directory: ios/JJWWReader
        run: |
          swift build -c release --target JJWWBookShell
          swift build -c release --target JJWWPagesReader
          swift build -c release --target JJWWPagination

      - name: Upload Stage 7 gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: jjww-stage7-binding
          path: /tmp/jjww-stage7/**
          if-no-files-found: error
