name: Materialize canonical v1.1

on:
  push:
    branches:
      - feature/jjww-reader-stage0
    paths:
      - tools/reseal_canonical_v1_1.py
      - .github/workflows/materialize-canonical-v1.1.yml

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/jjww-reader-stage0
          fetch-depth: 0

      - name: Materialize canonical v1.1
        run: python3 tools/reseal_canonical_v1_1.py

      - name: Verify generated canonical
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          p = Path('jesse-james-and-the-widow-whipple-canonical-v1.1.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['canonical_version'] == '1.1'
          assert data['validation']['status'] == 'PASS'
          assert data['validation']['line_sequence_sha256'] == '106274914ba9c0cc1afd4418d6e8a8dbfa62a5f2d04c9089d87aa0a406147a8e'
          assert data['chunks'][1]['blocks'][0]['date_text'] == 'Monday June 18, 1827'
          print('canonical v1.1 verification PASS')
          PY

      - name: Commit generated canonical artifacts
        run: |
          if git diff --quiet -- \
            jesse-james-and-the-widow-whipple-canonical.json \
            jesse-james-and-the-widow-whipple-canonical-v1.0.json \
            jesse-james-and-the-widow-whipple-canonical-v1.1.json; then
            echo 'Canonical files already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            jesse-james-and-the-widow-whipple-canonical.json \
            jesse-james-and-the-widow-whipple-canonical-v1.0.json \
            jesse-james-and-the-widow-whipple-canonical-v1.1.json
          git commit -m 'Materialize canonical Layer 0 v1.1'
          git push origin HEAD:feature/jjww-reader-stage0
